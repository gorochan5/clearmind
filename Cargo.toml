[package]
name = "clearmind"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7"
comemo = "0.5"
iced = { git = "https://github.com/iced-rs/iced", branch = "master", version = "0.15.0-dev", features = ["markdown", "highlighter", "advanced", "image", "svg", "tokio"] }
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
infer = "0.19"
merman = { version = "=0.8.0-alpha.6", default-features = false, features = ["svg", "layout-cytoscape"] }
merman-render = { version = "0.8.0", features = ["diagram-class", "diagram-flowchart", "diagram-mindmap"] }
notify = "8"
opener = { version = "0.8", default-features = false, features = ["reveal"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "http2", "charset", "system-proxy"] }
rfd = "0.15"
ropey = "1.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.0", features = ["full"] }
toml = "1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "local-time", "fmt"] }
tylax = { version = "0.3.8", default-features = false }
typst = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
unicode-segmentation = "1.13"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = true
codegen-units = 28
opt-level = 3

[profile.dev]
incremental = true
codegen-units = 28
